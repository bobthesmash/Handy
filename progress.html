    {

      "tasks": [

        { "id": "D-002", "title": "Jazyk: CZ only nebo CZ+EN", "status": "pending", "completedAt": null, "notes": "" },

<style>
  :root {

  .stat.done .stat-num { color: var(--green); }

  .chip {

  .phase-name { font-size: 16px; font-weight: 600; }

  .phase-right {
    display: flex;
    flex-direction: column;

  .phase-pct {

  }
  .task:last-child { border-bottom: none; }

  .status-dot {

    border-radius: 50%;

  }
  .status-pending     { background: var(--gray-soft); color: var(--text-2); }
  .status-in_progress { background: var(--blue-soft); color: var(--blue); }

  .task-id {

    color: var(--text-2);
  }
</style>

<body>
  <div class="container">
    <header>
      <h1 id="title">Handy</h1>
      <div class="subtitle" id="subtitle"></div>
      <div class="meta" id="meta"></div>

      <div class="overall">
        <div class="overall-row">
          <div>
            <div class="overall-pct"><span id="overallPctNum">0</span>%<span id="overallCount"></span></div>
            <div class="overall-text">celkový postup napříč všemi fázemi (mimo F5 a D)</div>
          </div>
          <div id="overallEta" class="overall-text" style="text-align:right;"></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="overallFill" style="width: 0%"></div></div>
      </div>

      <div class="stats" id="stats"></div>

      <div class="toolbar">
        <input type="search" id="searchInput" placeholder="Hledat (název nebo ID, např. F1-T03)…">
        <div id="chips"></div>
      </div>
    </header>

    <main id="phases"></main>

    <footer>
      Data: inline JSON v <code>&lt;script id=&quot;PROGRESS_DATA&quot;&gt;</code> v tomto souboru. <br>
      Agent workery upravují <em>jen</em> JSON blok + <code>IMPLEMENTATION_PLAN.md</code>. Tato stránka se sama přerenderuje po reloadu.
    </footer>
  </div>

<script>
(function() {
  const STATUS_LABEL = {
    pending: "Pending",
    in_progress: "In progress",
    done: "Done",
    blocked: "Blocked"
  };
  const STATUS_GLYPH = {
    pending: "·",
    in_progress: "▸",
    done: "✓",
    blocked: "!"
  };
  const STATUS_ORDER = ["all", "pending", "in_progress", "done", "blocked"];
  const FILTER_LABEL = {
    all: "Vše",
    pending: "Pending",
    in_progress: "In progress",
    done: "Done",
    blocked: "Blocked"
  };

  let DATA = null;
  let activeFilter = "all";
  let searchQuery = "";
  const collapsedPhases = new Set();

  function loadData() {
    const raw = document.getElementById("PROGRESS_DATA").textContent;
    try {
      DATA = JSON.parse(raw);
    } catch (e) {
      document.body.innerHTML = "<div style='padding:40px;color:#f87171;font-family:monospace'>Chyba při čtení PROGRESS_DATA: " + e.message + "</div>";
      throw e;
    }
  }

  function countTasks(filterFn) {
    let n = 0;
    DATA.phases.forEach(p => p.tasks.forEach(t => { if (filterFn(t, p)) n++; }));
    return n;
  }

  function renderHeader() {
    document.getElementById("title").textContent = DATA.projectName + " — Progress";
    document.getElementById("subtitle").textContent = DATA.subtitle || "";
    document.getElementById("meta").textContent = "Naposledy aktualizováno: " + (DATA.lastUpdated || "—");
  }

  function renderStats() {
    const counts = {
      total: 0, done: 0, in_progress: 0, blocked: 0, pending: 0
    };
    DATA.phases.forEach(p => p.tasks.forEach(t => {
      counts.total++;
      counts[t.status] = (counts[t.status] || 0) + 1;
    }));

    const statsEl = document.getElementById("stats");
    statsEl.innerHTML = `
      <div class="stat"><div class="stat-num">${counts.total}</div><div class="stat-label">Total</div></div>
      <div class="stat done"><div class="stat-num">${counts.done}</div><div class="stat-label">Done</div></div>
      <div class="stat in_progress"><div class="stat-num">${counts.in_progress}</div><div class="stat-label">In progress</div></div>
      <div class="stat blocked"><div class="stat-num">${counts.blocked}</div><div class="stat-label">Blocked</div></div>
      <div class="stat pending"><div class="stat-num">${counts.pending}</div><div class="stat-label">Pending</div></div>
    `;

    const corePhases = DATA.phases.filter(p => !["F5", "D"].includes(p.id));
    let coreTotal = 0, coreDone = 0;
    corePhases.forEach(p => p.tasks.forEach(t => {
      coreTotal++;
      if (t.status === "done") coreDone++;
    }));
    const pct = coreTotal === 0 ? 0 : Math.round((coreDone / coreTotal) * 100);
    document.getElementById("overallPctNum").textContent = pct;
    document.getElementById("overallCount").textContent = ` (${coreDone}/${coreTotal})`;
    document.getElementById("overallFill").style.width = pct + "%";

    const remaining = coreTotal - coreDone;
    document.getElementById("overallEta").innerHTML = `
      <div>Zbývá <strong style="color:var(--text-0)">${remaining}</strong> úkolů (F0–F4).</div>
      <div style="color:var(--text-2);font-size:12px;margin-top:2px;">F5 a otevřená rozhodnutí mimo cestu k MVP.</div>
    `;
  }

  function renderChips() {
    const chipsEl = document.getElementById("chips");
    chipsEl.innerHTML = "";
    STATUS_ORDER.forEach(s => {
      const chip = document.createElement("div");
      chip.className = "chip" + (activeFilter === s ? " active" : "");
      const count = s === "all"
        ? countTasks(() => true)
        : countTasks(t => t.status === s);
      chip.innerHTML = `${FILTER_LABEL[s]}<span class="count">${count}</span>`;
      chip.addEventListener("click", () => {
        activeFilter = s;
        renderChips();
        renderPhases();
      });
      chipsEl.appendChild(chip);
    });
  }

  function matchTask(task) {
    if (activeFilter !== "all" && task.status !== activeFilter) return false;
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      if (!task.id.toLowerCase().includes(q) &&
          !task.title.toLowerCase().includes(q) &&
          !(task.notes || "").toLowerCase().includes(q)) return false;
    }
    return true;
  }

  function renderPhases() {
    const root = document.getElementById("phases");
    root.innerHTML = "";

    let anyVisible = false;

    DATA.phases.forEach(phase => {
      const phaseDone = phase.tasks.filter(t => t.status === "done").length;
      const phaseTotal = phase.tasks.length;
      const phasePct = phaseTotal === 0 ? 0 : Math.round((phaseDone / phaseTotal) * 100);

      const visibleTasks = phase.tasks.filter(matchTask);
      if (visibleTasks.length === 0 && (searchQuery || activeFilter !== "all")) return;

      anyVisible = true;

      const phaseEl = document.createElement("section");
      phaseEl.className = "phase" + (collapsedPhases.has(phase.id) ? " collapsed" : "");
      phaseEl.dataset.phaseId = phase.id;

      phaseEl.innerHTML = `
        <div class="phase-header">
          <div style="flex:1;min-width:0">
            <div class="phase-title">
              <span class="phase-id">${phase.id}</span>
              <span class="phase-name">${phase.title}</span>
              <span class="phase-weeks">· ${phase.weeks}</span>
              <span class="phase-chevron">▾</span>
            </div>
            <div class="phase-goal">${phase.goal || ""}</div>
          </div>
          <div class="phase-right">
            <div class="phase-pct"><strong>${phaseDone}/${phaseTotal}</strong> · ${phasePct} %</div>
            <div class="phase-bar"><div class="phase-bar-fill" style="width:${phasePct}%"></div></div>
          </div>
        </div>
        <div class="phase-tasks"></div>
      `;

      const header = phaseEl.querySelector(".phase-header");
      header.addEventListener("click", () => {
        if (collapsedPhases.has(phase.id)) collapsedPhases.delete(phase.id);
        else collapsedPhases.add(phase.id);
        renderPhases();
      });

      const tasksEl = phaseEl.querySelector(".phase-tasks");
      visibleTasks.forEach(task => {
        const row = document.createElement("div");
        row.className = "task" + (task.status === "done" ? " done" : "");
        row.innerHTML = `
          <div class="status-dot status-${task.status}" title="${STATUS_LABEL[task.status]}">${STATUS_GLYPH[task.status]}</div>
          <div class="task-id">${task.id}</div>
          <div class="task-body">
            <div class="task-title">${escapeHtml(task.title)}</div>
            ${task.notes ? `<div class="task-notes">⚑ ${escapeHtml(task.notes)}</div>` : ""}
          </div>
          <div class="task-date">${task.completedAt || (task.status === "in_progress" ? "v běhu" : "")}</div>
        `;
        tasksEl.appendChild(row);
      });

      root.appendChild(phaseEl);
    });

    if (!anyVisible) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Žádný úkol neodpovídá filtru.";
      root.appendChild(empty);
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function bindSearch() {
    const input = document.getElementById("searchInput");
    input.addEventListener("input", e => {
      searchQuery = e.target.value.trim();
      renderPhases();
    });
  }

  loadData();
  renderHeader();
  renderStats();
  renderChips();
  renderPhases();
  bindSearch();
})();
</script>
</body>
</html>
